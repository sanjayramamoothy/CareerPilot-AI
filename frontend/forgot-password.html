<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CareerPilot AI</title>
    
    <!-- Meta Descriptions for SEO -->
    <meta name="description" content="Request a password reset link to recover access to your CareerPilot AI workspace.">
    <meta name="keywords" content="Forgot Password, Reset Password CareerPilot, Recover Account">
    <meta name="author" content="CareerPilot AI Team">
    
    <!-- Fonts Preconnect and Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Skip link for accessibility -->
    <a href="#forgot-form" class="skip-link">Skip to reset form</a>

    <main class="auth-container">
        <!-- Visual background blobs for rich aesthetics -->
        <div class="auth-bg-blob" aria-hidden="true"></div>

        <div class="auth-card">
            <!-- Header section -->
            <header class="auth-header">
                <a href="index.html" class="logo" aria-label="CareerPilot AI Home">
                    <div class="logo-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" stroke-width="2.5" fill="none">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                    </div>
                    <span>CareerPilot <span class="text-gradient">AI</span></span>
                </a>
                <h1 class="auth-title">Forgot Password?</h1>
                <p class="auth-subtitle">Enter your email and we'll send you a link to reset your password.</p>
            </header>

            <!-- Forgot Password Form -->
            <form id="forgot-form" class="auth-form" novalidate>
                <!-- Email field -->
                <div class="form-group">
                    <label for="email" class="form-label">Email address</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="you@example.com" 
                            required 
                            autocomplete="email"
                        >
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary auth-submit-btn">
                    <span class="spinner" aria-hidden="true"></span>
                    <span>Send Reset Link</span>
                </button>
            </form>

            <!-- Card Footer -->
            <footer class="auth-footer">
                <p>Back to <a href="login.html" class="auth-link">Log in</a></p>
            </footer>
        </div>
    </main>

    <!-- Global Javascript & Auth Handlers -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
