<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CareerPilot AI</title>
    
    <!-- Meta Descriptions for SEO -->
    <meta name="description" content="Create your CareerPilot AI account to start optimizing your resume, analyze keywords, and practice mock interviews.">
    <meta name="keywords" content="CareerPilot AI Register, Sign Up Resume Analyzer, Career Coach Account">
    <meta name="author" content="CareerPilot AI Team">
    
    <!-- Fonts Preconnect and Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Skip link for accessibility -->
    <a href="#register-form" class="skip-link">Skip to registration form</a>

    <main class="auth-container">
        <!-- Visual background blobs for rich aesthetics -->
        <div class="auth-bg-blob" aria-hidden="true"></div>

        <div class="auth-card">
            <!-- Header section -->
            <header class="auth-header">
                <a href="index.html" class="logo" aria-label="CareerPilot AI Home">
                    <div class="logo-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" stroke-width="2.5" fill="none">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                    </div>
                    <span>CareerPilot <span class="text-gradient">AI</span></span>
                </a>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Get started with a free analysis of your profile in under a minute.</p>
            </header>

            <!-- Registration Form -->
            <form id="register-form" class="auth-form" novalidate>
                <!-- Full name field -->
                <div class="form-group">
                    <label for="full-name" class="form-label">Full name</label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="full-name" 
                            name="full-name" 
                            class="form-input" 
                            placeholder="John Doe" 
                            required 
                            autocomplete="name"
                        >
                    </div>
                </div>

                <!-- Email field -->
                <div class="form-group">
                    <label for="email" class="form-label">Email address</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="you@example.com" 
                            required 
                            autocomplete="email"
                        >
                    </div>
                </div>

                <!-- Password field -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input form-input-password" 
                            placeholder="Min 8 characters (1 letter, 1 number)" 
                            required 
                            autocomplete="new-password"
                        >
                        <button type="button" class="password-toggle" aria-label="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    
                    <!-- Password Strength Meter component -->
                    <div class="password-strength-container">
                        <div class="password-strength-bar">
                            <div class="password-strength-fill"></div>
                        </div>
                        <div class="password-strength-text"></div>
                    </div>
                </div>

                <!-- Confirm Password field -->
                <div class="form-group">
                    <label for="confirm-password" class="form-label">Confirm password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="confirm-password" 
                            name="confirm-password" 
                            class="form-input form-input-password" 
                            placeholder="Re-enter password" 
                            required 
                            autocomplete="new-password"
                        >
                        <button type="button" class="password-toggle" aria-label="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Terms & Conditions acknowledgment -->
                <div class="form-options" style="margin-top: 0.25rem;">
                    <label class="checkbox-group" for="terms">
                        <input type="checkbox" id="terms" name="terms" required checked>
                        <span style="font-size: 0.85rem;">I agree to the <a href="#" class="auth-link">Terms of Service</a> and <a href="#" class="auth-link">Privacy Policy</a>.</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary auth-submit-btn">
                    <span class="spinner" aria-hidden="true"></span>
                    <span>Create Account</span>
                </button>

                <div class="auth-divider" style="margin: 1.25rem 0; text-align: center; color: var(--text-muted, #888); font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem;">
                    <span style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></span>
                    <span>OR</span>
                    <span style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></span>
                </div>

                <!-- Google OAuth Button -->
                <button type="button" class="btn btn-secondary btn-google-auth" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem; padding: 0.75rem; font-weight: 600;">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Sign up with Google</span>
                </button>

            </form>

            <!-- Card Footer -->
            <footer class="auth-footer">
                <p>Already have an account? <a href="login.html" class="auth-link">Log in</a></p>
            </footer>
        </div>
    </main>

    <!-- Global Javascript & Auth Handlers -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
