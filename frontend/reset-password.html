<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - CareerPilot AI</title>
    
    <!-- Meta Descriptions for SEO -->
    <meta name="description" content="Set a new password for your CareerPilot AI account to restore access.">
    <meta name="keywords" content="Reset Password, Change Password CareerPilot, Recovery Link">
    <meta name="author" content="CareerPilot AI Team">
    
    <!-- Fonts Preconnect and Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Skip link for accessibility -->
    <a href="#reset-form" class="skip-link">Skip to reset form</a>

    <main class="auth-container">
        <!-- Visual background blobs for rich aesthetics -->
        <div class="auth-bg-blob" aria-hidden="true"></div>

        <div class="auth-card">
            <!-- Header section -->
            <header class="auth-header">
                <a href="index.html" class="logo" aria-label="CareerPilot AI Home">
                    <div class="logo-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" stroke-width="2.5" fill="none">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                    </div>
                    <span>CareerPilot <span class="text-gradient">AI</span></span>
                </a>
                <h1 class="auth-title">Reset Password</h1>
                <p class="auth-subtitle">Enter your new password below to update your credentials.</p>
            </header>

            <!-- Reset Password Form -->
            <form id="reset-form" class="auth-form" novalidate>
                <!-- New Password field -->
                <div class="form-group">
                    <label for="password" class="form-label">New Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input form-input-password" 
                            placeholder="Min 8 characters (1 letter, 1 number)" 
                            required 
                            autocomplete="new-password"
                        >
                        <button type="button" class="password-toggle" aria-label="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password field -->
                <div class="form-group">
                    <label for="confirm-password" class="form-label">Confirm new password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="confirm-password" 
                            name="confirm-password" 
                            class="form-input form-input-password" 
                            placeholder="Re-enter new password" 
                            required 
                            autocomplete="new-password"
                        >
                        <button type="button" class="password-toggle" aria-label="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary auth-submit-btn">
                    <span class="spinner" aria-hidden="true"></span>
                    <span>Update Password</span>
                </button>
            </form>

            <!-- Card Footer -->
            <footer class="auth-footer">
                <p>Back to <a href="login.html" class="auth-link">Log in</a></p>
            </footer>
        </div>
    </main>

    <!-- Global Javascript & Auth Handlers -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
